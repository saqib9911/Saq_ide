<html lang="en" data-theme="dark">
<head>

<style>
:root{--bg:#1e1e2e;--bg-alt:#181825;--bg-dark:#11111b;--fg:#cdd6f4;--fg-dim:#6c7086;--border:#313244;--accent:#89b4fa;--accent-2:#cba6f7;--success:#a6e3a1;--error:#f38ba8;--warn:#f9e2af;--info:#89dceb;--modal-bg:rgba(0,0,0,.7)}
[data-theme="light"]{--bg:#fff;--bg-alt:#f5f5f5;--bg-dark:#fafafa;--fg:#1e1e2e;--fg-dim:#6c7086;--border:#e0e0e0;--accent:#4a90e2;--accent-2:#7c3aed;--success:#16a34a;--error:#dc2626;--warn:#ca8a04;--info:#0284c7;--modal-bg:rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100vh;height:100dvh;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-size:13px}
header{display:flex;gap:3px;padding:6px;background:var(--bg-alt);border-bottom:1px solid var(--border);align-items:center;overflow-x:auto;flex-shrink:0}
header h1{font-size:14px;color:var(--accent-2);white-space:nowrap;font-weight:800}
#projectName{flex:1;min-width:60px;background:var(--border);color:var(--fg);border:1px solid transparent;padding:6px 8px;border-radius:5px;font-size:12px;outline:none}
#projectName:focus{border-color:var(--accent)}
header button,header select{background:var(--border);color:var(--fg);border:none;padding:6px 8px;border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap}
header button:hover,header select:hover{background:var(--fg-dim)}
header select{max-width:130px}
.tabs{display:flex;gap:3px;padding:5px;background:var(--bg-alt);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;flex-shrink:0}
.tabs button{background:var(--border);color:var(--fg);border:none;padding:6px 10px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:500;opacity:.7}
.tabs button.active{background:var(--accent);color:#11111b;font-weight:700;opacity:1}
.tabs button[data-tab="md"].active{background:var(--warn)}
.tabs button[data-tab="scss"].active{background:#f5c2e7}
.tabs button[data-tab="ts"].active{background:var(--info)}
.tabs .spacer{flex:1}
.tabs .run{background:var(--success);color:#11111b;font-weight:700;opacity:1}
.tabs .run:disabled{opacity:.6;cursor:wait}
.tabs .format{background:#fab387;color:#11111b;font-weight:600;opacity:1}
.tabs .tool-btn{opacity:1}
.tabs .preview-btn{background:var(--accent-2);color:#11111b;font-weight:600;opacity:1}
main{flex:1;min-height:0;position:relative;overflow:hidden}
main.split .editor-wrap.active{bottom:50%}
main.split #previewArea{display:flex !important;position:absolute;top:50%;left:0;right:0;bottom:0;border-top:2px solid var(--accent)}
.editor-wrap{position:absolute;inset:0;display:none}
.editor-wrap.active{display:block}
.ace-editor{position:absolute;inset:0;font-size:14px!important}
#previewArea{position:absolute;inset:0;display:none;flex-direction:column}
#previewArea.active{display:flex}
#previewArea.fullscreen{position:fixed;inset:0;z-index:500;background:var(--bg)}
#previewBar{display:flex;gap:4px;padding:4px 6px;background:var(--bg-alt);align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;white-space:nowrap}
#previewBar::-webkit-scrollbar{height:3px}
#previewBar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#previewBar button{background:var(--error);color:#fff;border:none;padding:5px 9px;border-radius:4px;font-weight:700;cursor:pointer;font-size:11px;flex-shrink:0}
#previewBar .dev-btn{background:var(--border);color:var(--fg)}
#previewBar .dev-btn.active{background:var(--accent);color:#11111b}
#previewBar .split-btn{background:var(--accent-2);color:#11111b}
#previewBar .split-btn.active{background:var(--warn)}
#previewBar .fs-btn{background:var(--info);color:#11111b;font-weight:700}
#previewBar .fs-btn.active{background:var(--warn)}
#previewBar span{font-size:11px;color:var(--fg-dim);flex-shrink:0}
#previewWrap{flex:1;min-height:0;overflow:hidden;background:#2a2a3a;position:relative}
#preview{border:none;background:#fff;position:absolute;inset:0;width:100%;height:100%}
#preview.mobile{width:375px;max-width:100%;left:50%;right:auto;transform:translateX(-50%)}
#preview.tablet{width:768px;max-width:100%;left:50%;right:auto;transform:translateX(-50%)}
#consolePanel{flex:0 0 auto;height:130px;display:none;flex-direction:column;background:var(--bg-dark);border-top:2px solid var(--accent);position:relative;flex-shrink:0}
#consolePanel.open{display:flex}
#consoleResize{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:row-resize;z-index:10}
#consoleResize:hover{background:rgba(137,180,250,.3)}
.consoleHeader{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg-alt);border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0}
.consoleHeader span{color:var(--accent-2);font-weight:600}
.consoleHeader button{background:var(--border);color:var(--fg);border:none;padding:3px 7px;border-radius:3px;font-size:11px;cursor:pointer}
.consoleHeader button.active{background:var(--accent);color:#11111b}
.consoleHeader .spacer{flex:1}
#consoleBody{flex:1;overflow-y:auto;padding:4px 8px;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.5;-webkit-overflow-scrolling:touch}
.cl-line{display:flex;gap:6px;padding:2px 0;border-bottom:1px solid rgba(128,128,128,.1)}
.cl-badge{flex-shrink:0;font-weight:700;min-width:32px;font-size:10px}
.cl-msg{flex:1;word-break:break-word;white-space:pre-wrap}
.cl-time{flex-shrink:0;font-size:9px;color:var(--fg-dim);padding-top:2px}
.cl-log .cl-badge{color:var(--fg-dim)}
.cl-info{color:var(--info)}
.cl-warn{color:var(--warn)}
.cl-error{color:var(--error);background:rgba(243,139,168,.08);cursor:pointer}
.cl-error:hover{background:rgba(243,139,168,.18)}
.cl-compile{border-left:3px solid var(--error);padding-left:6px;background:rgba(243,139,168,.12)}
.cl-hidden{display:none}
#status{flex:0 0 auto;padding:4px 8px;font-size:11px;color:var(--fg-dim);background:var(--bg-alt);border-top:1px solid var(--border);display:flex;gap:4px;align-items:center;padding-bottom:calc(4px + env(safe-area-inset-bottom));overflow-x:auto;flex-shrink:0}
#statusMsg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#cursorPos{font-family:monospace;white-space:nowrap}
.status-btn{background:var(--border);color:var(--fg);border:none;padding:2px 6px;border-radius:3px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.status-btn.open,.status-btn.active{background:var(--accent);color:#11111b;font-weight:700}
.status-btn.auto-folder-on{background:var(--success);color:#11111b;font-weight:700}
.status-btn.font-btn{font-family:monospace;min-width:34px}
.badge{display:inline-block;min-width:14px;text-align:center;background:var(--fg-dim);color:var(--bg);border-radius:7px;padding:0 4px;font-size:9px;margin-left:2px}
.badge-error{background:var(--error);color:#fff;font-weight:700}
.badge-empty{display:none}
#saveMsg{font-size:10px;white-space:nowrap}
#saveMsg.ok{color:var(--success)}
#saveMsg.err{color:var(--error)}
#saveMsg.dim{color:var(--fg-dim)}
.loading-bar{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:pulse 1.5s ease infinite;position:absolute;top:0;left:0;right:0;z-index:100;display:none}
.loading-bar.show{display:block}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.modal{position:fixed;inset:0;background:var(--modal-bg);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal.open{display:flex}
.modal-content{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-content h2{font-size:16px;margin-bottom:14px;color:var(--accent-2)}
.modal-content .modal-close{margin-top:14px;background:var(--border);color:var(--fg);border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:13px}
.modal-content .primary{background:var(--accent);color:#11111b;font-weight:700}
.modal-content label{display:block;margin:10px 0 4px;font-size:12px;color:var(--fg-dim)}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--fg);padding:9px 12px;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.modal-content input:focus{border-color:var(--accent)}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer}
.lib-item:hover{background:var(--bg-alt)}
.lib-item input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.lib-item .lib-name{flex:1;font-size:13px}
.lib-item .lib-cat{font-size:10px;color:var(--fg-dim);background:var(--bg-alt);padding:2px 6px;border-radius:8px}
.palette-content{max-width:480px;padding:12px}
#paletteInput{width:100%;background:var(--bg-alt);border:1px solid var(--border);color:var(--fg);padding:12px 16px;border-radius:6px;font-size:14px;margin-bottom:8px;outline:none}
#paletteList{max-height:400px;overflow-y:auto}
.palette-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.palette-item:hover,.palette-item.selected{background:var(--bg-alt)}
.palette-item .palette-icon{font-size:16px}
.palette-item .palette-label{flex:1}
.palette-item .palette-key{font-size:10px;color:var(--fg-dim);font-family:monospace}
#projectsModal .modal-content{max-width:560px}
.proj-search{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.proj-search input{flex:1;min-width:120px;background:var(--bg-alt);border:1px solid var(--border);color:var(--fg);padding:10px 14px;border-radius:6px;font-size:13px;outline:none}
.proj-search button{background:var(--border);color:var(--fg);border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.proj-list{max-height:400px;overflow-y:auto;margin-bottom:10px}
.proj-item{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bg-alt);border-radius:8px;margin-bottom:6px;border:1px solid transparent;flex-wrap:wrap}
.proj-item.active{border-color:var(--accent)}
.proj-info{flex:1;cursor:pointer;min-width:0}
.proj-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:10px;color:var(--fg-dim);margin-top:3px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.proj-lang{display:inline-block;padding:1px 5px;background:var(--bg);border-radius:4px;font-size:9px;font-weight:700;color:var(--accent);font-family:monospace}
.proj-tag{display:inline-block;padding:1px 6px;background:var(--accent-2);color:#11111b;border-radius:8px;font-size:9px;font-weight:700}
.proj-actions{display:flex;gap:1px;flex-wrap:wrap}
.proj-actions button{background:transparent;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px;opacity:.7}
.proj-empty{text-align:center;padding:40px;color:var(--fg-dim);font-size:13px}
.proj-actions-bar{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.proj-actions-bar button{background:var(--bg-alt);color:var(--fg);border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;flex:1;min-width:100px}
.proj-actions-bar .primary{background:var(--accent);color:#11111b}
.tag-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag-filter button{background:var(--bg-alt);color:var(--fg-dim);border:1px solid var(--border);padding:3px 10px;border-radius:12px;font-size:10px;cursor:pointer}
.tag-filter button.active{background:var(--accent-2);color:#11111b;border-color:transparent;font-weight:700}
.shortcuts-table{width:100%;border-collapse:collapse;font-size:12px}
.shortcuts-table td{padding:6px 4px;border-bottom:1px solid var(--border)}
.shortcuts-table td:first-child{font-family:monospace;background:var(--bg-alt);padding:4px 8px;border-radius:4px;width:130px;color:var(--accent)}
.history-item{padding:10px;background:var(--bg-alt);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px}
.history-item .hist-time{color:var(--fg-dim);font-size:10px;flex-shrink:0}
#qrContainer{text-align:center;margin:12px 0}
#qrContainer canvas{display:inline-block;max-width:220px;height:auto;background:#fff;padding:8px;border-radius:8px}
.share-url{background:var(--bg-alt);border:1px solid var(--border);color:var(--fg);padding:10px 12px;border-radius:6px;font-size:11px;font-family:monospace;word-break:break-all;margin:8px 0;max-height:100px;overflow-y:auto}
.quick-chars{display:none;gap:2px;padding:4px 6px;background:var(--bg-alt);border-top:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.quick-chars.show{display:flex}
.quick-chars button{background:var(--border);color:var(--fg);border:none;padding:6px 10px;border-radius:4px;font-size:13px;font-family:monospace;cursor:pointer;min-width:32px;font-weight:600;flex-shrink:0}
.recent-bar{display:none;gap:4px;padding:3px 6px;background:var(--bg-alt);border-top:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.recent-bar.show{display:flex}
.recent-bar button{background:var(--bg);color:var(--fg);border:1px solid var(--border);padding:3px 8px;border-radius:10px;font-size:10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.recent-bar button.active{background:var(--accent);color:#11111b;font-weight:700}
.color-picker-float{position:fixed;bottom:80px;right:12px;z-index:50;display:none}
.color-picker-float.show{display:block}
.color-picker-float input{width:44px;height:44px;border:2px solid var(--border);border-radius:50%;cursor:pointer;padding:0;background:none}
.install-banner{position:fixed;left:10px;right:10px;bottom:calc(40px + env(safe-area-inset-bottom));background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#11111b;padding:12px 14px;display:none;align-items:center;gap:10px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:2000;font-size:13px}
.install-banner.show{display:flex;animation:installSlideUp .35s ease-out}
.install-banner.hide{animation:installSlideDown .3s ease-in forwards}
.install-banner .install-icon{font-size:26px;flex-shrink:0;background:rgba(255,255,255,.25);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.install-banner .install-text{flex:1;font-weight:700;line-height:1.2}
.install-banner .install-text small{display:block;font-weight:400;font-size:10.5px;opacity:.8;margin-top:3px}
.install-banner button{border:none;cursor:pointer;font-weight:700;border-radius:8px;font-size:12px;padding:8px 14px;flex-shrink:0}
.install-banner #installBtn{background:#11111b;color:var(--accent)}
.install-banner #installLater{background:transparent;color:#11111b;font-size:16px;padding:4px 6px;opacity:.6}
@keyframes installSlideUp{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes installSlideDown{from{transform:translateY(0);opacity:1}to{transform:translateY(120%);opacity:0}}
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header>
  <h1>Saq</h1>
  <input id="projectName" type="text" placeholder="Project name">
  <select id="templatesBtn" title="Templates & Projects">
    <option value="">📁</option>
    <optgroup label="✨ Templates">
      <option value="blank">Blank</option>
      <option value="clock">Live Clock</option>
      <option value="counter">Counter</option>
      <option value="todo">Todo List</option>
      <option value="calculator">Calculator</option>
      <option value="blog">Blog Post</option>
    </optgroup>
    <optgroup label="📂 My Projects" id="recentProjectsGroup"></optgroup>
  </select>
  <button id="projectsBtn" title="All Projects">📂</button>
  <button id="newProjectBtn" title="New">➕</button>
  <button id="shareBtn" title="Share">🔗</button>
  <button id="saveAsBtn" title="Save to Folder">💾</button>
  <button id="zipBtn" title="ZIP">📦</button>
  <button id="deleteProjectBtn" title="Delete">🗑️</button>
</header>

<div class="tabs">
  <button data-tab="html" class="active">HTML</button>
  <button data-tab="css">CSS</button>
  <button data-tab="js">JS</button>
  <button data-tab="md">MD</button>
  <button data-tab="scss">SCSS</button>
  <button data-tab="ts">TS</button>
  <div class="spacer"></div>
  <button id="emmetBtn" class="tool-btn" title="Emmet">⚡</button>
  <button id="formatBtn" class="format" title="Format">✨</button>
  <button id="runBtn" class="run">▶ Run</button>
  <button id="previewBtn" class="preview-btn">👁</button>
  <button id="paletteBtn" class="tool-btn" title="Commands">⋯</button>
</div>

<main id="mainArea">
  <div class="editor-wrap active" data-lang="html"><div class="ace-editor" id="ace-html"></div></div>
  <div class="editor-wrap" data-lang="css"><div class="ace-editor" id="ace-css"></div></div>
  <div class="editor-wrap" data-lang="js"><div class="ace-editor" id="ace-js"></div></div>
  <div class="editor-wrap" data-lang="md"><div class="ace-editor" id="ace-md"></div></div>
  <div class="editor-wrap" data-lang="scss"><div class="ace-editor" id="ace-scss"></div></div>
  <div class="editor-wrap" data-lang="ts"><div class="ace-editor" id="ace-ts"></div></div>
  <div id="previewArea">
    <div id="previewBar">
      <button id="closePreviewBtn">✕</button>
      <button class="dev-btn active" data-dev="desktop">🖥</button>
      <button class="dev-btn" data-dev="tablet">📱</button>
      <button class="dev-btn" data-dev="mobile">📱</button>
      <button class="split-btn" id="splitBtn" title="Split">▥</button>
      <button class="fs-btn" id="fsBtn" title="Fullscreen">⛶</button>
      <span>Preview</span>
    </div>
    <div id="previewWrap"><iframe id="preview" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-same-origin allow-modals allow-forms allow-popups allow-downloads allow-pointer-lock"></iframe></div>
  </div>
</main>

<div class="quick-chars" id="quickChars">
  <button data-char="<">&lt;</button><button data-char=">">&gt;</button><button data-char="/">/</button>
  <button data-char="{">{</button><button data-char="}">}</button><button data-char="(">(</button>
  <button data-char=")">)</button><button data-char="[">[</button><button data-char="]">]</button>
  <button data-char=";">;</button><button data-char="=">=</button><button data-char="&quot;">"</button>
  <button data-char="'">'</button><button data-char=":">:</button><button data-char="&#9;">⇥</button>
</div>

<div id="consolePanel">
  <div id="consoleResize"></div>
  <div class="consoleHeader">
    <span>📟</span>
    <button data-filter="all" class="active">All</button>
    <button data-filter="log">Log</button>
    <button data-filter="warn">Warn</button>
    <button data-filter="error">Error</button>
    <div class="spacer"></div>
    <button id="exportConsole">⬇️</button>
    <button id="clearConsole">🗑️</button>
    <button id="closeConsole">✕</button>
  </div>
  <div id="consoleBody"></div>
</div>

<div class="recent-bar" id="recentBar"></div>

<div id="status">
  <span id="statusMsg">Ready</span>
  <span id="cursorPos">Ln 1, C1</span>
  <button id="fontBtn" class="status-btn font-btn">14px</button>
  <button id="autoFolderBtn" class="status-btn" title="Auto-save folder">💾A</button>
  <button id="autoRunToggle" class="status-btn" title="Auto-run">⏱</button>
  <button id="themeToggle" class="status-btn" title="Theme">🌙</button>
  <button id="consoleToggle" class="status-btn">📟<span id="errBadge" class="badge badge-empty"></span></button>
  <button id="shortcutsBtn" class="status-btn" title="Shortcuts">?</button>
  <span id="saveMsg"></span>

function emCSS(a){const ks=Object.keys(EC).sort((x,y)=>y.length-x.length);for(const k of ks){if(a.startsWith(k)&&a.length>k.length){let v=a.slice(k.length),cv;if(/^#/.test(v))cv=v;else if(/^-?\d*\.?\d+%$/.test(v))cv=v;else if(/^-?\d*\.?\d+(-?\d*\.?\d+)*$/.test(v))cv=v.split('-').filter(x=>x!=='').map(x=>x+'px').join(' ');else if(v==='n')cv='none';else if(v==='f')cv='flex';else if(v==='b')cv='block';else cv=v;return EC[k].split(', ').map(p=>`${p}: ${cv};`).join(' ');}}return null;}
function emHTML(a){const tp=spl(a,'+');if(tp.length>1)return tp.map(p=>emHTML(p.trim())).filter(Boolean).join('\n');const gi=findTop(a,'>');if(gi!==-1){const l=a.slice(0,gi).trim(),r=a.slice(gi+1).trim();const m=l.match(/^([a-z][a-z0-9-]*)?(?:\.([\w-]+))?(?:\*(\d+))?$/i);if(!m)return null;const[,t,c,n]=m;const ch=spl(r,'+').map(x=>emHTML(x.trim())).filter(Boolean);if(!ch.length)return null;const tag=t||'div',attr=c?` class="${c}"`:'';const inner=ch.join('\n').split('\n').map(l=>'  '+l).join('\n');let h=`<${tag}${attr}>\n${inner}\n</${tag}>`;if(n)h=Array(parseInt(n)).fill(h).join('\n');return h;}const m=a.match(/^([a-z][a-z0-9-]*)?(?:([.#])([\w-]+))?(?:\*(\d+))?$/i);if(!m)return null;let[,t,s,nm,n]=m;if(!t&&!nm)return null;if(!t)t='div';const attr=s==='.'?` class="${nm}"`:s==='#'?` id="${nm}"`:'';const rep=n?parseInt(n):1;let h=`<${t}${attr}></${t}>`;if(rep>1)h=Array(rep).fill(h).join('\n');return h;}
function tryEmmet(){const tab=document.querySelector('.tabs button[data-tab].active').dataset.tab;const ed=editors[tab];if(!ed)return false;const r=ed.getSelectionRange();if(r.start.row!==r.end.row){ed.insert('  ');return true;}const line=ed.session.getLine(r.start.row);const before=line.substring(0,r.start.column);const m=before.match(/[a-z][a-z0-9.#>:+*\-()]*$/i);if(!m){ed.insert('  ');return true;}const ab=m[0];let exp=null;try{if(tab==='css'||tab==='scss')exp=emCSS(ab);else if(tab==='html'||tab==='md')exp=emHTML(ab);}catch(e){}if(exp&&exp!==ab){ed.session.replace({start:{row:r.start.row,column:r.start.column-ab.length},end:r.start},exp);}else ed.insert('  ');return true;}

function addConsoleLine(type,args,isCompile){const div=document.createElement('div');div.className='cl-line cl-'+type+(isCompile?' cl-compile':'');div.dataset.type=type;if(currentFilter!=='all'&&currentFilter!==type)div.classList.add('cl-hidden');const b=document.createElement('span');b.className='cl-badge';b.textContent=type==='log'?'›':type;div.appendChild(b);const m=document.createElement('span');m.className='cl-msg';m.textContent=Array.isArray(args)?args.join(' '):String(args);div.appendChild(m);const t=document.createElement('span');t.className='cl-time';t.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});div.appendChild(t);if(type==='error'){const lm=String(args[0]||'').match(/line (\d+)/i);if(lm){const ln=parseInt(lm[1]);div.onclick=()=>{const tab=document.querySelector('.tabs button[data-tab].active').dataset.tab;editors[tab].gotoLine(ln);editors[tab].focus();};}}consoleBody.appendChild(div);while(consoleBody.children.length>MAXC)consoleBody.removeChild(consoleBody.firstChild);consoleBody.scrollTop=consoleBody.scrollHeight;msgCount++;if(type==='error')errCount++;updateBadge();if(type==='error')openConsole();}
function updateBadge(){if(errCount>0){errBadge.textContent=errCount;errBadge.className='badge badge-error';}else if(msgCount>0){errBadge.textContent=msgCount;errBadge.className='badge';}else{errBadge.textContent='';errBadge.className='badge badge-empty';}}

window.addEventListener('message',(e)=>{if(!e.data||e.data.__pg!==1)return;if(e.source!==previewFrame.contentWindow)return;if(e.data.type==='clear'){clearConsole();return;}const valid=['log','info','warn','error','debug'];addConsoleLine(valid.includes(e.data.type)?e.data.type:'log',e.data.args||[],false);});

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed: '+src));document.head.appendChild(s);});}

function compileSCSS(s){return new Promise((res,rej)=>{try{Sass.compile(s,r=>{if(r.status===0)res(r.text);else{const l=r.line?'line '+r.line+': ':'';rej(new Error(l+(r.message||'SCSS')));}});}catch(e){rej(e);}});}
function compileTS(c){const r=window.ts.transpileModule(c,{compilerOptions:{target:window.ts.ScriptTarget.ES2020},reportDiagnostics:true,fileName:'user.ts'});if(r.diagnostics&&r.diagnostics.length){const d=r.diagnostics[0];const m=window.ts.flattenDiagnosticMessageText(d.messageText,' ');let li='',ln=0;if(d.file&&typeof d.start==='number'){try{const p=d.file.getLineAndCharacterOfPosition(d.start);ln=p.line+1;li='line '+ln+': ';}catch{}}const err=new Error(li+m);err.line=ln;err.lang='ts';throw err;}return r.outputText;}

const CONSOLE_HOOK='<script>(function(){function send(t,a){try{parent.postMessage({__pg:1,type:t,args:a},"*");}catch(e){}}function ser(v){try{if(typeof v==="undefined")return"undefined";if(typeof v==="function")return"[Fn "+(v.name||"anon")+"]";if(typeof v==="object"&&v!==null){var s=new WeakSet();return JSON.stringify(v,function(k,x){if(typeof x==="object"&&x!==null){if(s.has(x))return"[Circular]";s.add(x);}if(typeof x==="function")return"[Fn "+(x.name||"anon")+"]";if(typeof x==="undefined")return"[undefined]";return x;},2);}return String(v);}catch(e){return"[Unserializable]";}}["log","info","warn","error","debug"].forEach(function(m){var o=console[m];console[m]=function(){var a=Array.prototype.slice.call(arguments).map(ser);send(m,a);try{o.apply(console,arguments);}catch(e){}};});var oc=console.clear;console.clear=function(){send("clear",[]);try{oc&&oc.apply(console,arguments);}catch(e){}};window.addEventListener("error",function(e){var m=e.message||"Error";if(e.lineno)m+=" (line "+e.lineno+(e.colno?":"+e.colno:"")+")";send("error",[m]);});window.addEventListener("unhandledrejection",function(e){var r=e.reason;var msg=(r&&r.message)||String(r)||"Unhandled";send("error",["Unhandled: "+msg]);});})();<\/script>';

function isFullDoc(h){return /<!doctype\s+html|<html(\s[^>]*)?>/i.test(h);}
function injHead(d,c){if(/<\/head\s*>/i.test(d))return d.replace(/<\/head\s*>/i,()=>c+'\n</head>');if(/<html(\s[^>]*)?>/i.test(d))return d.replace(/<html(\s[^>]*)?>/i,m=>m+'\n<head>'+c+'\n</head>');return c+'\n'+d;}
function injBody(d,c){if(/<\/body\s*>/i.test(d))return d.replace(/<\/body\s*>/i,()=>c+'\n</body>');if(/<\/html\s*>/i.test(d))return d.replace(/<\/html\s*>/i,()=>c+'\n</html>');return d+'\n'+c;}
function injHook(d){if(/<head(\s[^>]*)?>/i.test(d))return d.replace(/<head(\s[^>]*)?>/i,m=>m+'\n'+CONSOLE_HOOK);if(/<body(\s[^>]*)?>/i.test(d))return d.replace(/<body(\s[^>]*)?>/i,m=>m+'\n'+CONSOLE_HOOK);if(/<html(\s[^>]*)?>/i.test(d))return d.replace(/<html(\s[^>]*)?>/i,m=>m+'\n'+CONSOLE_HOOK);return CONSOLE_HOOK+'\n'+d;}
function getLibs(){const p=getCurrent();if(!p||!p.libs)return[];return LIBRARIES.filter(l=>p.libs.includes(l.id));}
function libsHTML(){return getLibs().map(l=>l.type==='css'?`<link rel="stylesheet" href="${l.url}">`:`<script src="${l.url}"><\/script>`).join('\n');}

async function buildDoc(){
let rawH=editors.html.getValue(),fC=editors.css.getValue(),fJ=editors.js.getValue();
if(editors.md.getValue().trim()){await ensureMarked();try{rawH=window.marked.parse(editors.md.getValue());}catch(e){throw new Error('MD: '+e.message);}}
if(editors.scss.getValue().trim()){await ensureSass();fC=await compileSCSS(editors.scss.getValue());}
if(editors.ts.getValue().trim()){await ensureTS();fJ=compileTS(editors.ts.getValue());}
const safeJ=fJ.replace(/<\/script>/gi,'<\\/script>');
const libs=libsHTML();
if(isFullDoc(rawH)){let d=rawH;if(libs)d=injHead(d,libs);if(fC.trim())d=injHead(d,'<style>\n'+fC+'\n</style>');d=injHook(d);if(safeJ.trim())d=injBody(d,'<script>\n'+safeJ+'\n<\/script>');return d;}
return '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n'+libs+'\n<style>\n'+fC+'\n</style>\n</head>\n<body>\n'+rawH+'\n'+CONSOLE_HOOK+'\n<script>\n'+safeJ+'\n<\/script>\n</body>\n</html>';
}

async function formatCurrent(){const at=document.querySelector('.tabs button[data-tab].active');if(!at)return;const lang=at.dataset.tab,ed=editors[lang],code=ed.getValue();if(!code.trim())return;let parser,plugins;
if(lang==='html'){parser='html';plugins=[pHtml,pEstree];}

async function importProject(){const input=document.createElement('input');input.type='file';input.accept='.html,.htm,.zip';
input.onchange=async(e)=>{const file=e.target.files[0];if(!file)return;
try{if(file.name.endsWith('.zip')){const zip=await JSZip.loadAsync(await file.arrayBuffer());const htmls=Object.keys(zip.files).filter(f=>/\.html?$/i.test(f)&&!f.startsWith('__MACOSX'));const main=htmls.find(f=>/index\.html?$/i.test(f))||htmls[0];if(!main){alert('No HTML');return;}const html=await zip.file(main).async('string');const name=file.name.replace(/\.zip$/i,'');const p=createProject(name,{html,css:'',js:'',md:'',scss:'',ts:''});const srcs=Object.keys(zip.files).filter(f=>/^src\//i.test(f)&&!f.endsWith('/'));for(const sf of srcs){const base=sf.split('/').pop().toLowerCase();const m=base.match(/^(html|css|js|md|scss|ts)\./);if(m)p[m[1]]=await zip.file(sf).async('string');}currentId=p.id;loadToEditors();persist();flash('✓ ZIP','ok');}

closeModal('projectsModal');}catch(err){alert('Error: '+err.message);}};
input.click();
}

async function shortenUrl(longUrl){const apis=[u=>'https://is.gd/create.php?format=simple&url='+encodeURIComponent(u),u=>'https://tinyurl.com/api-create.php?url='+encodeURIComponent(u)];for(const api of apis){try{const res=await fetch(api(longUrl));if(!res.ok)continue;const txt=(await res.text()).trim();if(txt.startsWith('http')&&txt.length<200)return txt;}catch(e){}}return null;}

function renderProjectsList(filter){

filtered.sort((a,b)=>(b.updated||0)-(a.updated||0));
list.innerHTML='';
if(!filtered.length){list.innerHTML='<div class="proj-empty">No projects</div>';return;}
filtered.forEach(p=>{
const div=document.createElement('div');div.className='proj-item'+(p.id===currentId?' active':'');
const langs=[];if(p.html&&p.html.trim())langs.push('H');if(p.css&&p.css.trim())langs.push('C');if(p.js&&p.js.trim())langs.push('J');if(p.md&&p.md.trim())langs.push('M');if(p.scss&&p.scss.trim())langs.push('S');if(p.ts&&p.ts.trim())langs.push('T');
const tags=(p.tags||[]).map(t=>`<span class="proj-tag">#${esc(t)}</span>`).join('');
div.innerHTML=`<div class="proj-info"><div class="proj-name">${esc(p.name)}</div><div class="proj-meta"><span>${timeAgo(p.updated)}</span>•<span>${fmtSize(pSize(p))}</span>${langs.map(l=>`<span class="proj-lang">${l}</span>`).join('')}${tags}</div></div><div class="proj-actions"><button data-act="tag">🏷</button><button data-act="rename">✏️</button><button data-act="duplicate">📋</button><button data-act="export">📦</button><button data-act="delete">🗑️</button></div>`;

div.querySelectorAll('button[data-act]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();const act=b.dataset.act;

else if(act==='duplicate'){const c=JSON.parse(JSON.stringify(p));c.id='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);c.name=p.name+' (copy)';c.updated=Date.now();projects.unshift(c);persist();renderProjectsList(filter);updateTemplatesDropdown();}
else if(act==='export'){const oi=currentId;currentId=p.id;loadToEditors();downloadZip();if(oi!==p.id){currentId=oi;persistCurrent();loadToEditors();}}

};});
list.appendChild(div);
});
}

document.addEventListener('keydown',(e)=>{
if((e.ctrlKey||e.metaKey)&&e.key==='s'&&!e.shiftKey){e.preventDefault();saveCurrent();flash('✓','ok');}
if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run();}
if((e.ctrlKey||e.metaKey)&&e.key==='o'){e.preventDefault();openProjectsModal();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='F'||e.key==='f')){e.preventDefault();formatCurrent();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='P'||e.key==='p')){e.preventDefault();openPalette();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='N'||e.key==='n')){e.preventDefault();$('newProjectBtn').click();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='S'||e.key==='s')){e.preventDefault();openShareModal();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='H'||e.key==='h')){e.preventDefault();openHistoryModal();}
if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='A'||e.key==='a')){e.preventDefault();toggleAutoFolder();}
if((e.ctrlKey||e.metaKey)&&e.key==='`'){e.preventDefault();toggleConsole();}
if(e.key==='F1'){e.preventDefault();$('shortcutsBtn').click();}
});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click',()=>b.closest('.modal').classList.remove('open')));

(async function init(){
initEditors();applyTheme();applyFont();applyWrap();applyKeybinding();updateAutoRunUI();updateAutoFolderUI();
loadProjects();
const fromUrl=loadFromShareUrl();
if(!fromUrl){const saved=localStorage.getItem(CK);if(saved&&projects.find(p=>p.id===saved))currentId=saved;else if(projects.length>0)currentId=projects[0].id;loadToEditors();}
updateTemplatesDropdown();
try{const h=await getHandle();if(h&&(await h.queryPermission({mode:'readwrite'}))==='granted'){autoFolderHandle=h;autoFolderEnabled=true;updateAutoFolderUI();}}catch{}
setStatus('⚡ SaqPlayground ready');
})();
})();
</script>

<script>
(function(){
'use strict';
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>console.log('✅ PWA:',r.scope)).catch(e=>console.warn('⚠️ PWA:',e.message));});}
const banner=document.getElementById('installBanner');const installBtn=document.getElementById('installBtn');const laterBtn=document.getElementById('installLater');
let deferredPrompt=null,bannerShown=false;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
if(localStorage.getItem('pwa_installed')==='1'||isStandalone()){banner.remove();return;}
if(sessionStorage.getItem('pwa_dismissed')==='1'){banner.remove();return;}
function showBanner(){if(bannerShown||isStandalone())return;bannerShown=true;banner.classList.remove('hide');banner.classList.add('show');}
function hideBanner(p){banner.classList.remove('show');banner.classList.add('hide');setTimeout(()=>{banner.style.display='none';},300);if(p)localStorage.setItem('pwa_installed','1');else sessionStorage.setItem('pwa_dismissed','1');}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;setTimeout(showBanner,800);});
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
if(isIOS&&!isStandalone()){setTimeout(()=>{if(isStandalone())return;const t=banner.querySelector('.install-text');t.innerHTML='Install SaqPlayground <small>Share ⬆️ → Add to Home Screen</small>';installBtn.style.display='none';showBanner();},2000);}
installBtn.addEventListener('click',async()=>{if(!deferredPrompt){alert('Menu → Install app');return;}deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')hideBanner(true);else hideBanner(false);deferredPrompt=null;});
laterBtn.addEventListener('click',()=>hideBanner(false));
window.addEventListener('appinstalled',()=>hideBanner(true));
})();
</script>

</body>
</html>
